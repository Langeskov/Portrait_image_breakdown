[project]
name = "photo"
version = "1.0.0"
description = "人像摄影的 2D 姿态分析、现场指令与图片对比工具"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4,<9",
    "opencv-python>=4.8,<6",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "PySide6>=6.7,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
